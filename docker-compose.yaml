
services:
  frontend:
    build: ./client 
    image: samyak2005/scr-client:latest
    ports:
      - "5173:5173"
    environment:
      - VITE_SERVER_URL=http://localhost:30080
    networks:
      - student-repo-network
    
  backend:
    container_name: server
    build: ./server
    image: student-repo-server
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - SECRET_KEY=mykey123
      - MONGODBURL=mongodb://root:root@mongodb:27017/?authSource=admin
    depends_on:
      - mongodb
    networks:
      - student-repo-network    
  mongodb:
    image: mongo
    container_name: mongodb
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=root
      - MONGO_INITDB_ROOT_PASSWORD=root
    volumes:
      - mongo-data:/data/db
    networks:
      - student-repo-network

networks:
  student-repo-network:
    driver: bridge

volumes:
  mongo-data: